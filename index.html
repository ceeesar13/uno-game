<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ============ START SCREEN ============ -->
    <section id="start-screen" class="screen">
      <div class="start">
        <div class="logo" aria-hidden="true">
          <span class="logo__word">UNO</span>
        </div>
        <p class="start__tag">El clásico de cartas. Tú contra los bots.</p>
        <form id="start-form" class="start__form" novalidate>
          <label class="start__label" for="name-input">¿Cómo te llamas?</label>
          <input id="name-input" class="start__input" type="text" maxlength="16"
                 placeholder="Tu nombre" autocomplete="off" required>

          <span class="start__label">¿Contra cuántos bots?</span>
          <div class="opp-select" role="group" aria-label="Cantidad de bots">
            <button type="button" class="opp-option" data-count="1">1</button>
            <button type="button" class="opp-option" data-count="2">2</button>
            <button type="button" class="opp-option" data-count="3">3</button>
          </div>

          <button type="submit" class="btn btn--primary">Jugar</button>
        </form>
      </div>
    </section>

    <!-- ============ GAME SCREEN ============ -->
    <section id="game-screen" class="screen" hidden>
      <header class="topbar">
        <div class="brand"><span class="brand__mark">UNO</span></div>
        <div class="score" aria-label="Marcador">
          <span class="score__side">
            <span class="score__name" id="score-player-name">Tú</span>
            <b id="score-player">0</b>
          </span>
          <span class="score__dash">—</span>
          <span class="score__side"><b id="score-cpu">0</b> Bots</span>
        </div>
      </header>

      <div id="arena" class="arena">
        <section class="table" id="center-area">
          <button id="draw-pile" class="pile pile--draw" type="button" aria-label="Robar una carta">
            <div class="card card--back"><span class="card__logo">UNO</span></div>
            <span class="pile__caption">Robar</span>
          </button>

          <div id="discard-pile" class="pile pile--discard" aria-label="Descarte"></div>

          <div class="status">
            <div id="turn-banner" class="banner" aria-live="polite" aria-atomic="true"></div>
            <div id="color-chip" class="chip" hidden>
              <span class="chip__dot"></span><span id="color-chip-name" class="chip__name"></span>
            </div>
            <button id="pass-btn" class="btn btn--ghost" type="button" hidden>Pasar turno</button>
          </div>
        </section>

        <section class="zone zone--player" id="player-zone">
          <div class="zone__label">
            <span id="player-label">Tú</span>
            <span class="points" aria-label="Puntos"><b id="points">100</b> pts</span>
          </div>
          <div id="player-hand" class="fan fan--player"></div>
        </section>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </section>

    <!-- ============ COLOR PICKER ============ -->
    <div id="color-picker" class="overlay" role="dialog" aria-modal="true" aria-labelledby="color-picker-title" hidden>
      <div class="overlay__panel">
        <p class="overlay__title" id="color-picker-title">Elige un color</p>
        <div class="color-grid">
          <button class="color-btn color-btn--red" type="button" data-color="red" aria-label="Rojo"></button>
          <button class="color-btn color-btn--blue" type="button" data-color="blue" aria-label="Azul"></button>
          <button class="color-btn color-btn--green" type="button" data-color="green" aria-label="Verde"></button>
          <button class="color-btn color-btn--yellow" type="button" data-color="yellow" aria-label="Amarillo"></button>
        </div>
      </div>
    </div>

    <!-- ============ GAME OVER ============ -->
    <div id="game-over" class="overlay" role="dialog" aria-modal="true" aria-labelledby="game-over-message" hidden>
      <div class="overlay__panel">
        <p id="game-over-message" class="overlay__title"></p>
        <p id="game-over-score" class="overlay__sub"></p>
        <button id="play-again-btn" class="btn btn--primary" type="button">Jugar de nuevo</button>
      </div>
    </div>

  </div>
  <script src="game.js"></script>
</body>
</html>
